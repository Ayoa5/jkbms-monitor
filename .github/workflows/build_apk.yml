name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE=$(ls -d "$SDK/cmdline-tools"/*/bin 2>/dev/null | head -1)
          echo "SDK=$SDK"
          echo "CMDLINE=$CMDLINE"
          yes | "$CMDLINE/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$CMDLINE/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JkBmsMonitor-debug-apk
          path: src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
